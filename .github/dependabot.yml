# Dependency updates arrive as pull requests and go through the full pipeline
# (SCA and image scans included) like any other change.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    # Paused: no version-update PRs until this line and the next are removed.
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
      day: monday
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
    commit-message:
      prefix: build

  - package-ecosystem: docker
    directory: /
    # Paused: no version-update PRs until this line and the next are removed.
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: "*"
        update-types: [ "version-update:semver-major" ]
    commit-message:
      prefix: build

  - package-ecosystem: github-actions
    directory: /
    # Paused: no version-update PRs until this line and the next are removed.
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
