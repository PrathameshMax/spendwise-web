name: ci

# Stages live in PrathameshMax/spendwise-ci (node-app.yml): secret scan, CodeQL,
# npm signature check and audit, build, then Dockerfile lint, image scan, image
# policy, push, sign, attest, and the Helm chart, plus the SonarCloud quality
# gate. main then promotes the signed digest dev -> sit -> uat. prod is
# released by release.yml against an approved Change Request.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pipeline:
    uses: PrathameshMax/spendwise-ci/.github/workflows/node-app.yml@v1
    permissions:
      contents: read
      actions: read
      pull-requests: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    with:
      image-name: spendwise-web
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  promote:
    needs: pipeline
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    uses: PrathameshMax/spendwise-ci/.github/workflows/promote.yml@v1
    permissions:
      contents: read
      packages: write
    with:
      image: ${{ needs.pipeline.outputs.image }}
      digest: ${{ needs.pipeline.outputs.digest }}
