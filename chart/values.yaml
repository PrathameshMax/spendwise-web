image:
  repository: ghcr.io/prathameshmax/spendwise-web
  # Used only when digest is empty (a local `helm install` from source).
  tag: main
  # Written by the pipeline into every packaged chart; wins over tag.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

fullnameOverride: ""

replicaCount: 2

containerPorts:
  - name: http
    containerPort: 8080

service:
  create: true

serviceAccount:
  create: true
  name: ""
  # Not mounted: the service never calls the Kubernetes or Vault API.
  automountToken: false

# Wiring that is the same in every environment. Environment-specific settings
# (database host, Kafka, Vault, Keycloak) come from the deploying environment's
# values file or from envFrom (ConfigMap / Secret references), never from here.
env:
  - name: GATEWAY_URL
    value: "http://localhost:8080"
  - name: KEYCLOAK_URL
    value: "http://localhost:8180"

envFrom: []

podSecurity:
  # nginx-unprivileged runs as uid 101 and owns its cache and config paths.
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101

# The root filesystem is read-only. nginx renders its config from templates
# into conf.d at start-up and keeps its pid and cache under these paths.
writablePaths:
  - /tmp
  - /var/cache/nginx
  - /etc/nginx/conf.d

probes:
  port: http
  liveness: /healthz
  readiness: /healthz
  startupFailureThreshold: 12

terminationGracePeriodSeconds: 15

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    memory: 64Mi

podDisruptionBudget:
  enabled: true
  minAvailable: 1

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
